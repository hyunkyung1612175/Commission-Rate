<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생보 시상율 자동 변환</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

    :root {
      --bg:          #080c12;
      --surface:     #0f1520;
      --surface2:    #161e2e;
      --border:      #1e2d45;
      --border2:     #243450;
      --accent:      #2563eb;
      --accent-glow: rgba(37,99,235,0.18);
      --accent-dim:  #1d4ed8;
      --text:        #cdd8f0;
      --text-dim:    #4e6288;
      --text-mid:    #8fa3c8;
      --success:     #22c55e;
      --success-bg:  rgba(34,197,94,0.08);
      --error:       #f87171;
      --error-bg:    rgba(248,113,113,0.08);
      --warning:     #fbbf24;
      --warning-bg:  rgba(251,191,36,0.08);
      --mono:        'IBM Plex Mono', monospace;
      --sans:        'IBM Plex Sans KR', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 80px;
    }

    /* ── GRID BACKGROUND ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(37,99,235,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container { position: relative; z-index: 1; width: 100%; max-width: 620px; }

    /* ── HEADER ── */
    header { text-align: center; margin-bottom: 52px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-glow);
      border: 1px solid rgba(37,99,235,0.35);
      color: #60a5fa;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      padding: 5px 14px;
      border-radius: 100px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 8px #60a5fa;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
      color: #e8f0ff;
    }

    h1 span {
      font-family: var(--mono);
      color: #60a5fa;
      font-weight: 600;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.6;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03) inset;
    }

    /* ── UPLOAD GRID ── */
    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }

    .upload-zone {
      position: relative;
      border: 1.5px dashed var(--border2);
      border-radius: 14px;
      padding: 28px 18px 22px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--surface2);
      overflow: hidden;
    }

    .upload-zone::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, var(--accent-glow), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .upload-zone:hover::after,
    .upload-zone.dragover::after { opacity: 1; }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: #111c30;
    }

    .upload-zone.filled {
      border-color: var(--success);
      border-style: solid;
      background: rgba(34,197,94,0.04);
    }

    .upload-zone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .zone-icon {
      font-size: 30px;
      margin-bottom: 10px;
      display: block;
    }

    .zone-tag {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(37,99,235,0.3);
      padding: 3px 10px;
      border-radius: 100px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .zone-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .zone-hint {
      font-size: 11px;
      color: var(--text-dim);
    }

    .zone-filename {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--success);
      margin-top: 8px;
      word-break: break-all;
      display: none;
    }

    .upload-zone.filled .zone-filename { display: block; }
    .upload-zone.filled .zone-hint     { display: none; }

    /* ── INFO BOX ── */
    .info-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 13px;
      color: var(--text-mid);
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .info-box .formula {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--accent-glow);
      color: #93c5fd;
      padding: 2px 8px;
      border-radius: 5px;
      border: 1px solid rgba(37,99,235,0.3);
    }

    /* ── BUTTON ── */
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 20px rgba(37,99,235,0.4);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-dim);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(37,99,235,0.5);
    }

    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-download {
      width: 100%;
      padding: 15px;
      background: transparent;
      color: var(--success);
      border: 1.5px solid var(--success);
      border-radius: 12px;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
      display: none;
      letter-spacing: -0.01em;
    }

    .btn-download:hover {
      background: var(--success-bg);
      box-shadow: 0 0 20px rgba(34,197,94,0.2);
    }

    /* ── STATUS ── */
    .status-box {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 16px;
      font-weight: 500;
    }

    .status-box.processing {
      display: flex;
      background: var(--warning-bg);
      border: 1px solid rgba(251,191,36,0.25);
      color: var(--warning);
    }

    .status-box.success {
      display: flex;
      background: var(--success-bg);
      border: 1px solid rgba(34,197,94,0.25);
      color: var(--success);
    }

    .status-box.error {
      display: flex;
      background: var(--error-bg);
      border: 1px solid rgba(248,113,113,0.25);
      color: var(--error);
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(251,191,36,0.25);
      border-top-color: var(--warning);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── STATS STRIP ── */
    .stats {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .stats.visible { display: grid; }

    .stat-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      text-align: center;
    }

    .stat-value {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 600;
      color: var(--accent);
      display: block;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ── FOOTER ── */
    footer {
      margin-top: 36px;
      font-family: var(--sans);
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">생보관리팀 자동화 도구</div>
    <h1>생보 시상율 자동 변환</h1>
    <p class="subtitle">
      검토본의 하이라이트 영역을 감지해<br>
      원본 PDF의 해당 숫자를 70%로 자동 대체합니다
    </p>
  </header>

  <div class="card">
    <div class="upload-grid">
      <!-- 원본 PDF -->
      <div class="upload-zone" id="origZone">
        <input type="file" accept=".pdf" id="origInput">
        <span class="zone-icon">📄</span>
        <span class="zone-tag">원본</span>
        <span class="zone-label">원본 PDF</span>
        <span class="zone-hint">수정될 파일</span>
        <span class="zone-filename" id="origName"></span>
      </div>

      <!-- 검토본 PDF -->
      <div class="upload-zone" id="reviewZone">
        <input type="file" accept=".pdf" id="reviewInput">
        <span class="zone-icon">🔍</span>
        <span class="zone-tag">검토본</span>
        <span class="zone-label">검토 PDF</span>
        <span class="zone-hint">하이라이트된 파일</span>
        <span class="zone-filename" id="reviewName"></span>
      </div>
    </div>

    <div class="info-box">
      검토본의 형광펜 하이라이트 위치 숫자를
      <span class="formula">Math.floor(숫자 × 0.7)</span>
      로 원본에 직접 치환합니다.
      파일은 브라우저 내에서만 처리되며 서버로 전송되지 않습니다.
    </div>

    <button class="btn-primary" id="processBtn" disabled>처리 시작</button>

    <div class="status-box" id="statusBox">
      <div class="spinner" id="statusSpinner" style="display:none"></div>
      <span id="statusText"></span>
    </div>

    <div class="stats" id="stats">
      <div class="stat-box">
        <span class="stat-value" id="statPages">0</span>
        <div class="stat-label">수정된 페이지</div>
      </div>
      <div class="stat-box">
        <span class="stat-value" id="statNums">0</span>
        <div class="stat-label">치환된 숫자</div>
      </div>
    </div>

    <button class="btn-download" id="downloadBtn">⬇ 결과 파일 다운로드</button>
  </div>

  <footer>
    인카금융서비스 제도관리부 생보관리팀
  </footer>
</div>

<script>
// ─────────────────────────────────────────────
// 상수
// ─────────────────────────────────────────────
const RATE             = 0.7;
const ERASE_INSET      = 1.0;
const PERCENT_SEARCH_X = 60.0;
const PERCENT_GAP      = 0.4;
const H_PAD            = 0.0;
const NUM_PATTERN      = /(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?/g;

// PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Canvas 텍스트 너비 측정용
const _mc  = document.createElement('canvas');
const _mct = _mc.getContext('2d');

function measureW(str, fs) {
  _mct.font = `${fs}px "Helvetica Neue", Helvetica, Arial`;
  return _mct.measureText(str).width;
}

// ─────────────────────────────────────────────
// 유틸
// ─────────────────────────────────────────────
function calcFloor(numStr) {
  // numStr: 순수 숫자 문자열 ("200", "1,000", "95.5" 등)
  const hasComma = numStr.includes(',');
  const v = parseFloat(numStr.replace(/,/g, ''));
  if (isNaN(v)) return numStr;
  const result = Math.floor(v * RATE);
  return hasComma ? result.toLocaleString('en-US') : String(result);
}

function overlap(ax0, ay0, ax1, ay1, bx0, by0, bx1, by1) {
  return ax0 < bx1 && ax1 > bx0 && ay0 < by1 && ay1 > by0;
}

function hitsAny(x0, y0, x1, y1, rects) {
  for (const [rx0, ry0, rx1, ry1] of rects) {
    if (overlap(x0, y0, x1, y1, rx0, ry0, rx1, ry1)) return true;
  }
  return false;
}

function inset(x0, y0, x1, y1, d) {
  const nx0 = x0 + d, ny0 = y0 + d, nx1 = x1 - d, ny1 = y1 - d;
  if (nx1 <= nx0 || ny1 <= ny0) return [x0, y0, x1, y1];
  return [nx0, ny0, nx1, ny1];
}

// ─────────────────────────────────────────────
// 핵심 처리 함수
// ─────────────────────────────────────────────
async function processPdfs(origBuf, reviewBuf, onProgress) {
  // --- 두 PDF를 PDF.js로 읽기 ---
  const origU8   = new Uint8Array(origBuf);
  const reviewU8 = new Uint8Array(reviewBuf);

  const origDoc   = await pdfjsLib.getDocument({ data: new Uint8Array(origU8)   }).promise;
  const reviewDoc = await pdfjsLib.getDocument({ data: new Uint8Array(reviewU8) }).promise;

  // --- pdf-lib로 원본 로드 (수정용) ---
  const pdfDoc = await PDFLib.PDFDocument.load(origU8);
  const font   = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);

  const pageCount    = Math.min(origDoc.numPages, reviewDoc.numPages);
  let changedPages   = 0;
  let totalReplaced  = 0;

  for (let pno = 0; pno < pageCount; pno++) {
    onProgress(`페이지 ${pno + 1} / ${pageCount} 처리 중...`);

    const [origPage, reviewPage] = await Promise.all([
      origDoc.getPage(pno + 1),
      reviewDoc.getPage(pno + 1),
    ]);

    // ── 하이라이트 수집 ──
    const anns = await reviewPage.getAnnotations();
    const highlights = anns
      .filter(a => a.subtype === 'Highlight')
      .map(a => {
        const [x0, y0, x1, y1] = a.rect;
        return [x0 - H_PAD, y0 - H_PAD, x1 + H_PAD, y1 + H_PAD];
      });

    if (highlights.length === 0) continue;

    // ── 원본 텍스트 파싱 ──
    const tc = await origPage.getTextContent({ normalizeWhitespace: false });

    const items = tc.items
      .filter(it => it.str && it.str.trim())
      .map(it => {
        const [a, b, , , e, f] = it.transform;
        // font size: item.height 우선, 없으면 transform 크기
        const fs     = Math.abs(it.height) || Math.hypot(a, b) || 10;
        const iw     = Math.abs(it.width);
        const asc    = fs * 0.80;   // 위쪽 (ascent)
        const desc   = fs * 0.20;   // 아래쪽 (descent)
        return {
          text:     it.str,
          x0:       e,
          x1:       e + iw,
          baseline: f,
          y0:       f - desc,
          y1:       f + asc,
          fs,
          iw,
        };
      });

    const pdfLibPage = pdfDoc.getPage(pno);
    const redacts    = [];   // [x0, y0, x1, y1]
    const inserts    = [];   // [x, y, str, fs]

    // ── "숫자%" 패턴을 한 토큰으로 처리
    // 케이스 A: item.text 자체가 "200%", "95%" 등 (가장 많은 경우)
    // 케이스 B: item.text가 "200", 다음 인접 아이템이 "%" (분리 케이스)
    const PCT_FULL = /^((?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)([%％])$/;
    const NUM_ONLY = /^(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?$/;

    for (const item of items) {
      if (!hitsAny(item.x0, item.y0, item.x1, item.y1, highlights)) continue;

      const txt = item.text.trim();

      // ── 케이스 A: "숫자%" 한 덩어리 ──
      const mFull = txt.match(PCT_FULL);
      if (mFull) {
        const origNum = mFull[1];   // "200"
        const pctChr  = mFull[2];   // "%"
        const newNum  = calcFloor(origNum);
        const newToken = newNum + pctChr;  // "140%"

        // 원본 전체 bbox를 지우고 새 토큰 삽입
        const [ex0, ey0, ex1, ey1] = inset(item.x0, item.y0, item.x1, item.y1, ERASE_INSET);
        if (ex1 > ex0 && ey1 > ey0) redacts.push([ex0, ey0, ex1, ey1]);

        // 새 토큰 너비 계산 후 원래 bbox 왼쪽 정렬 삽입
        const newTokenW = font.widthOfTextAtSize(newToken, item.fs);
        const origW     = item.x1 - item.x0;
        const insX      = item.x0 + Math.max(0, (origW - newTokenW) / 2);
        inserts.push([insX, item.baseline, newToken, item.fs]);
        totalReplaced++;
        continue;
      }

      // ── 케이스 B: 숫자만 있는 아이템 + 인접 % 아이템 ──
      if (!NUM_ONLY.test(txt)) continue;

      // 인접한 % 아이템 찾기
      let pctItem = null;
      for (const other of items) {
        const ot = other.text.replace(/\s/g, '');
        if (ot !== '%' && ot !== '％') continue;
        // 같은 줄 (y 겹침)
        const yOv  = Math.min(item.y1, other.y1) - Math.max(item.y0, other.y0);
        const minH = Math.min(item.y1 - item.y0, other.y1 - other.y0);
        if (minH <= 0 || yOv / minH < 0.5) continue;
        // % 가 숫자 바로 오른쪽
        if (other.x0 >= item.x1 - 2 && other.x0 <= item.x1 + PERCENT_SEARCH_X) {
          pctItem = other; break;
        }
      }

      if (!pctItem) continue;

      // 숫자 아이템도 하이라이트에 걸려야 함
      if (!hitsAny(item.x0, item.y0, item.x1, item.y1, highlights)) continue;

      const origNum  = txt;
      const newNum   = calcFloor(origNum);
      const newToken = newNum + '%';

      // 숫자 아이템 지우기
      const [ex0, ey0, ex1, ey1] = inset(item.x0, item.y0, item.x1, item.y1, ERASE_INSET);
      if (ex1 > ex0 && ey1 > ey0) redacts.push([ex0, ey0, ex1, ey1]);

      // % 아이템 지우기
      const [px0, py0, px1, py1] = inset(pctItem.x0, pctItem.y0, pctItem.x1, pctItem.y1, ERASE_INSET);
      if (px1 > px0 && py1 > py0) redacts.push([px0, py0, px1, py1]);

      // 숫자 아이템 자리에 "새숫자%" 삽입 (숫자+% 합쳐서)
      const newTokenW = font.widthOfTextAtSize(newToken, item.fs);
      const origSpan  = pctItem.x1 - item.x0;  // 숫자~% 전체 너비
      const insX      = item.x0 + Math.max(0, (origSpan - newTokenW) / 2);
      inserts.push([insX, item.baseline, newToken, item.fs]);
      totalReplaced++;
    }

    if (redacts.length === 0) continue;
    changedPages++;

    // 1) 흰 사각형으로 기존 숫자 지우기
    for (const [x0, y0, x1, y1] of redacts) {
      if (x1 > x0 && y1 > y0) {
        pdfLibPage.drawRectangle({
          x: x0, y: y0,
          width:  x1 - x0,
          height: y1 - y0,
          color: PDFLib.rgb(1, 1, 1),
          borderWidth: 0,
        });
      }
    }

    // 2) 새 숫자 그리기
    for (const [x, y, str, fs] of inserts) {
      try {
        pdfLibPage.drawText(str, {
          x, y,
          size:  fs,
          font:  font,
          color: PDFLib.rgb(0, 0, 0),
        });
      } catch (e) {
        console.warn('텍스트 삽입 실패:', e.message, str, x, y, fs);
      }
    }
  }

  const resultBytes = await pdfDoc.save();
  return { bytes: resultBytes, changedPages, totalReplaced };
}

// ─────────────────────────────────────────────
// UI 상태 관리
// ─────────────────────────────────────────────
let origFile   = null;
let reviewFile = null;
let resultBlob = null;
let origFileName = '';

const origInput   = document.getElementById('origInput');
const reviewInput = document.getElementById('reviewInput');
const origZone    = document.getElementById('origZone');
const reviewZone  = document.getElementById('reviewZone');
const origName    = document.getElementById('origName');
const reviewName  = document.getElementById('reviewName');
const processBtn  = document.getElementById('processBtn');
const downloadBtn = document.getElementById('downloadBtn');
const statusBox   = document.getElementById('statusBox');
const statusText  = document.getElementById('statusText');
const statusSpinner = document.getElementById('statusSpinner');
const statsEl     = document.getElementById('stats');
const statPages   = document.getElementById('statPages');
const statNums    = document.getElementById('statNums');

function setStatus(type, msg) {
  statusBox.className = 'status-box ' + type;
  statusText.textContent = msg;
  statusSpinner.style.display = type === 'processing' ? 'block' : 'none';
  if (type === '') statusBox.className = 'status-box';
}

function updateBtn() {
  processBtn.disabled = !(origFile && reviewFile);
}

function setupZone(zone, input, nameEl, onFile) {
  input.addEventListener('change', () => {
    if (input.files[0]) onFile(input.files[0]);
  });
  zone.addEventListener('dragover', e => {
    e.preventDefault();
    zone.classList.add('dragover');
  });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f && f.name.toLowerCase().endsWith('.pdf')) onFile(f);
  });
}

setupZone(origZone, origInput, origName, f => {
  origFile     = f;
  origFileName = f.name;
  origName.textContent = f.name;
  origZone.classList.add('filled');
  resetResult();
  updateBtn();
});

setupZone(reviewZone, reviewInput, reviewName, f => {
  reviewFile = f;
  reviewName.textContent = f.name;
  reviewZone.classList.add('filled');
  resetResult();
  updateBtn();
});

function resetResult() {
  resultBlob = null;
  downloadBtn.style.display = 'none';
  statsEl.classList.remove('visible');
  statusBox.className = 'status-box';
}

// ── 처리 시작 ──
processBtn.addEventListener('click', async () => {
  if (!origFile || !reviewFile) return;

  processBtn.disabled = true;
  downloadBtn.style.display = 'none';
  statsEl.classList.remove('visible');
  setStatus('processing', '파일 읽는 중...');

  try {
    const [origBuf, reviewBuf] = await Promise.all([
      origFile.arrayBuffer(),
      reviewFile.arrayBuffer(),
    ]);

    const { bytes, changedPages, totalReplaced } = await processPdfs(
      origBuf, reviewBuf,
      msg => setStatus('processing', msg)
    );

    resultBlob = new Blob([bytes], { type: 'application/pdf' });

    setStatus('success', `완료 — ${changedPages}개 페이지, ${totalReplaced}개 숫자 치환`);

    statPages.textContent = changedPages;
    statNums.textContent  = totalReplaced;
    statsEl.classList.add('visible');

    downloadBtn.style.display = 'block';

  } catch (err) {
    console.error(err);
    setStatus('error', '오류: ' + err.message);
  } finally {
    processBtn.disabled = false;
  }
});

// ── 다운로드 ──
downloadBtn.addEventListener('click', () => {
  if (!resultBlob) return;
  const url = URL.createObjectURL(resultBlob);
  const a   = document.createElement('a');
  a.href     = url;
  a.download = '결과_' + origFileName.replace(/^원본_?/, '');
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
});
</script>
